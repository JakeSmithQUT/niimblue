{
  "appId": "com.niimblue.studio",
  "productName": "Niimblue Studio",
  "directories": {
    "output": "release"
  },
  "files": ["dist/**/*", "electron/dist/**/*", "package.json"],
  "win": {
    "target": ["nsis"]
  },
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true,
    "perMachine": false
  },
  "mac": {
    "target": ["dmg"]
  },
  "linux": {
    "target": ["AppImage"]
  }
}
